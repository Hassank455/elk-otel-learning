# Logstash pipeline: input -> filter -> output

input {
  # Tail the NestJS log file (mounted from ./nest-app/logs into the container)
  file {
    path => "/var/log/nest-app/*.log"
    start_position => "beginning"                              # read old lines the first time
    sincedb_path => "/usr/share/logstash/data/sincedb-nest-app" # remembers how far we've read
    codec => "json"                                            # each line is one JSON object
  }
}

filter {
  # Tag slow operations so they are easy to find: tags: "slow"
  if [durationMs] and [durationMs] > 1000 {
    mutate { add_tag => ["slow"] }
  }

  # Every error also gets an "alert" tag
  if [level] == "error" {
    mutate { add_tag => ["alert"] }
  }

  # Add a field that says who shipped the log, and the environment
  mutate {
    add_field => {
      "shipper" => "logstash"
      "environment" => "local"
    }
    # The raw line is already parsed into fields, no need to store it twice
    remove_field => ["[event][original]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nest-app-logs-logstash"
  }

  # Print every event in the Logstash container logs (for learning/debugging)
  stdout { codec => rubydebug }
}
