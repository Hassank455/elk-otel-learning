services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.1.0}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node        # single node only (for learning)
      - xpack.security.enabled=false      # no password (learning only, never in production)
      - ES_JAVA_OPTS=-Xms1g -Xmx1g        # JVM heap size
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-9.1.0}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200   # service name, not localhost
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy                      # wait until Elasticsearch is ready

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-9.1.0}
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro   # our pipeline config
      - ./nest-app/logs:/var/log/nest-app:ro                  # the app's log files
      - ls-data:/usr/share/logstash/data                      # sincedb + queue survive restarts
    ports:
      - "9600:9600"                                           # Logstash monitoring API
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
  ls-data:
