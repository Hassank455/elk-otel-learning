services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.1.0}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node        # نود واحد فقط (للتعلم)
      - xpack.security.enabled=false      # بدون كلمة سر (للتعلم فقط، لا تستخدمه في production)
      - ES_JAVA_OPTS=-Xms1g -Xmx1g        # حجم الذاكرة المخصصة لـ Java
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      retries: 12

volumes:
  es-data:
